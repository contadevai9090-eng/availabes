<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.2" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow circle -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.3" filter="url(#outerGlow)"/>

  <!-- Shield shape -->
  <path d="M256 48 L416 128 L416 288 C416 368 352 432 256 472 C160 432 96 368 96 288 L96 128 Z"
        fill="url(#shieldGrad)" stroke="url(#neonGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Inner shield highlight -->
  <path d="M256 80 L392 148 L392 280 C392 348 338 404 256 440 C174 404 120 348 120 280 L120 148 Z"
        fill="none" stroke="url(#neonGrad)" stroke-width="1" opacity="0.4"/>

  <!-- PBO file icon -->
  <rect x="196" y="168" width="120" height="148" rx="8" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#neonGlow)"/>
  <path d="M196 168 L268 168 L316 216 L316 316" fill="none" stroke="url(#neonGrad)" stroke-width="2.5"/>
  <path d="M268 168 L268 216 L316 216" fill="none" stroke="url(#neonGrad)" stroke-width="2"/>

  <!-- Lock icon on file -->
  <rect x="232" y="248" width="48" height="36" rx="4" fill="url(#neonGrad)" opacity="0.8"/>
  <path d="M244 248 L244 236 C244 224 268 224 268 236 L268 248" fill="none" stroke="url(#neonGrad)" stroke-width="2.5"/>
  <circle cx="256" cy="264" r="5" fill="#0a0a1a"/>
  <rect x="254" y="264" width="4" height="10" rx="1" fill="#0a0a1a"/>

  <!-- Binary code decoration -->
  <text x="136" y="180" font-family="Consolas,monospace" font-size="10" fill="#00d4ff" opacity="0.3">01</text>
  <text x="136" y="200" font-family="Consolas,monospace" font-size="10" fill="#a855f7" opacity="0.3">10</text>
  <text x="136" y="220" font-family="Consolas,monospace" font-size="10" fill="#00d4ff" opacity="0.3">11</text>
  <text x="136" y="240" font-family="Consolas,monospace" font-size="10" fill="#a855f7" opacity="0.3">00</text>

  <text x="340" y="260" font-family="Consolas,monospace" font-size="10" fill="#00d4ff" opacity="0.3">10</text>
  <text x="340" y="280" font-family="Consolas,monospace" font-size="10" fill="#a855f7" opacity="0.3">01</text>
  <text x="340" y="300" font-family="Consolas,monospace" font-size="10" fill="#00d4ff" opacity="0.3">11</text>
  <text x="340" y="320" font-family="Consolas,monospace" font-size="10" fill="#a855f7" opacity="0.3">00</text>

  <!-- PixPBO text -->
  <text x="256" y="400" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="36" font-weight="700" fill="url(#neonGrad)" filter="url(#neonGlow)">PixPBO</text>
  <text x="256" y="425" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#00d4ff" opacity="0.7" letter-spacing="6">PROTECT</text>
</svg>
